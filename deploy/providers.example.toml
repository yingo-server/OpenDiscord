# OpenDiscord 供应商适配器示例配置（OPS-2，lts-1.4-plan §5 第 2/7 行）
#
# 用途：给 authsvc 的短信 / 邮件魔法链接 / 图形验证码三个通道接上「通用 HTTP
# webhook」实现。机制只有一条：POST JSON 到配置的 URL，超时 3 秒，非 2xx
# 一律视为失败。阿里云 / 腾讯云等官方 SDK 不内置——请自建一个轻量 relay
# （函数计算 / Cloudflare Worker / 小型 Go 服务均可），把云厂商鉴权放在
# relay 侧，OpenDiscord 只见到这一个 webhook。
#
# 部署：复制到 /etc/opendiscord/providers.toml（mode 0640 root:opendiscord），
# 并在 chatd 配置中指向它（见 providers_path）。文件缺失或某通道 url 为空
# 时，该通道保持 fail-closed：不发送、不 panic（短信/邮件验证码照常签发但
# 不投递；验证码校验按未配置拒绝）。
#
# 本文件为示例，不含任何真实密钥。

[providers.sms]
# 通用 webhook。请求体：{"type":"sms","phone":"+86...","code":"123456"}
# 期望：3 秒内返回任意 2xx。
# 阿里云示例：relay 内部调用 dysmsapi 发短信
url = "http://127.0.0.1:9901/relay/aliyun/sms"

[providers.mail]
# 请求体：{"type":"magic_link","email":"a@b.co","link":"https://.../login?..."}
# 腾讯云 SES / 自建 SMTP 都建议经 relay。
url = "http://127.0.0.1:9901/relay/tencent/mail"

[providers.captcha]
# 请求体：{"type":"captcha","token":"...","remote_ip":"..."}
# 非零（非 2xx）即校验失败；服务端未配置时验证码请求按 CAPTCHA_REQUIRED 拒绝。
url = "http://127.0.0.1:9901/relay/generic/captcha"

[providers]
# 单次 webhook 预算（毫秒），缺省 3000。过大将拖慢登录请求，不建议调整。
timeout_ms = 3000
