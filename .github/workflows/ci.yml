name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=mod

jobs:
  # ---------------------------------------------------------------------------
  # Go：后端仓库，没有任何前端构建步骤。
  # protoc 可选：make proto 在缺少 protoc 时保留仓库内已提交的 chatpb 实现。
  # ---------------------------------------------------------------------------
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # 有 protoc 时重新生成；没有则直接使用已提交的 wire 兼容实现（exit 0）。
      - name: Generate proto (optional, protoc not required)
        run: make proto

      - name: Verify committed chatpb fallback exists
        run: test -f server/internal/proto/gen/chatpb/chatpb.go

      - name: Lint
        run: make lint

      - name: Import lint (bridge-design §4.1 red lines)
        run: bash scripts/importlint.sh

      - name: Test
        run: make test

      # 后端无前端依赖：go job 自包含。
      - name: Build (no frontend artifacts)
        run: make build

  # ---------------------------------------------------------------------------
  # 全平台/全 CPU 架构构建（后端产物矩阵，无任何前端步骤）。
  # ---------------------------------------------------------------------------
  build-matrix:
    if: startsWith(github.ref, 'refs/tags/v*')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # apt 必须同时装 gcc 交叉编译器与目标架构的 libc 开发头：只装 gcc-*-linux-gnu
          # 会缺 bits/libc-header-start.h，CGO 编译直接失败（曾因此只剩 amd64 一格产物）。
          - { goos: linux,   goarch: amd64,   pkg: tar.gz, cc: x86_64-linux-gnu-gcc,    apt: "gcc-x86-64-linux-gnu libc6-dev-amd64-cross" }
          - { goos: linux,   goarch: "386",   pkg: tar.gz, cc: i686-linux-gnu-gcc,      apt: "gcc-i686-linux-gnu libc6-dev-i386-cross" }
          - { goos: linux,   goarch: arm64,   pkg: tar.gz, cc: aarch64-linux-gnu-gcc,   apt: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross" }
          - { goos: linux,   goarch: arm,     pkg: tar.gz, cc: arm-linux-gnueabihf-gcc, apt: "gcc-arm-linux-gnueabihf libc6-dev-armhf-cross" }
          # riscv64: CGO 交叉链接在 GitHub runner 上不稳定（cmd/link 反复崩），
          # 且从未用于部署；跳过以保证 amd64/arm 等生产产物能正常发布。
          # 需要时在有原生 riscv64 工具链的机器上单独构建。
          - { goos: linux,   goarch: riscv64, pkg: tar.gz, cc: "", apt: "", unsupported: true }
          - { goos: windows, goarch: amd64,   pkg: zip,    cc: x86_64-w64-mingw32-gcc,  apt: "gcc-mingw-w64-x86-64" }
          - { goos: windows, goarch: "386",   pkg: zip,    cc: i686-w64-mingw32-gcc,    apt: "gcc-mingw-w64-i686" }
          # 无 mingw 交叉编译器可产出 CGO 二进制；这两格不构建（在 README/known-issues 标注）
          - { goos: windows, goarch: arm64,   pkg: zip,    cc: "", apt: "", unsupported: true }
          - { goos: windows, goarch: arm,     pkg: zip,    cc: "", apt: "", unsupported: true }
    name: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true


      - name: Install cross toolchain
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }} zip


      - name: Cross-build package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          PKG: ${{ matrix.pkg }}
        run: |
          if [ "${{ matrix.unsupported }}" = "true" ]; then
            echo "::warning::$GOOS/$GOARCH has no stable CGO toolchain on this runner; not built (documented unsupported target)"
            exit 0
          fi
          if [ -n "$CC" ] && ! command -v "$CC" >/dev/null 2>&1; then
            # Runner 偶发缺交叉编译器（riscv64 常见）。非生产架构缺工具链时
            # 优雅跳过该 target，不阻塞其余 8 个产物与 release；amd64 绝不会
            # 走到这里（其 CC 是 gcc，runner 自带）。
            echo "::warning::cross compiler $CC missing for $GOOS/$GOARCH; skipping this optional target"
            mkdir -p dist
            exit 0
          fi
          CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH CC=$CC \
            go build -trimpath -ldflags "-s -w" -o "stage/chatd$([ "$GOOS" = windows ] && echo .exe)" ./server/cmd/chatd
          # chatd-pg: SAME chatd source built with -tags pgdriver, which blank-
          # imports pgx/v5/stdlib so the "pgx" driver is registered in-process
          # and assemble.go step 8 opens the cold store. The default chatd
          # build stays driver-free (architecture red line).
          if [ "$GOOS" != windows ]; then
            CGO_ENABLED=1 GOOS=$GOOS GOARCH=$GOARCH CC=$CC \
              go build -tags pgdriver -trimpath -ldflags "-s -w" -o "stage/chatd-pg" ./server/cmd/chatd
          fi
          mkdir -p stage/docs stage/deploy
          cp README.md LICENSE stage/
          cp docs/deploy.md docs/user-guide.md docs/admin-guide.md docs/known-issues.md stage/docs/ 2>/dev/null || true
          if [ "$GOOS" != windows ]; then
            cp -R deploy/systemd deploy/journald deploy/keygen deploy/lib deploy/install.sh deploy/install-interactive deploy/backup.sh deploy/release.sh deploy/Caddyfile deploy/ufot.toml deploy/policy.json stage/deploy/ 2>/dev/null || true
          fi
          # tr -c would also turn the trailing newline into '-', producing
          # 'v1.1.0-' and therefore 'ufot-v1.1.0--linux-amd64.tar.gz'.
          # Strip the newline first.
          VER="$(git describe --tags --always 2>/dev/null | tr -d '\n' | tr -c 'A-Za-z0-9._-' '-')"
          NAME="ufot-$VER-$GOOS-$GOARCH.$PKG"
          mkdir -p dist
          if [ "$PKG" = zip ]; then (cd stage && zip -qr "../dist/$NAME" .); else tar -czf "dist/$NAME" -C stage .; fi
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 7
          if-no-files-found: warn

  # 源码包（FFmpeg 惯例）
  src-package:
    if: startsWith(github.ref, 'refs/tags/v*')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Source tarball
        run: |
          # tr -c would also turn the trailing newline into '-', producing
          # 'v1.1.0-' and therefore 'ufot-v1.1.0--linux-amd64.tar.gz'.
          # Strip the newline first.
          VER="$(git describe --tags --always 2>/dev/null | tr -d '\n' | tr -c 'A-Za-z0-9._-' '-')"
          mkdir -p dist
          git archive --format=tar.gz --prefix="ufot-$VER-src/" HEAD > "dist/ufot-$VER-src.tar.gz"
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-src
          path: dist/*
          retention-days: 7

  # 汇总 + 发布到 GitHub Release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [go, build-matrix, src-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Build SHA256SUMS
        run: |
          cd dist
          # Artifacts unpack into per-artifact subdirectories, so a plain
          # "sha256sum *" hits directories and fails. Flatten the package
          # files to dist/ first, then hash only those.
          find . -mindepth 2 -maxdepth 3 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec mv -f {} . \;
          rm -rf src-package 2>/dev/null || true
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%P\n' \
            | sort | xargs -r sha256sum > SHA256SUMS
          ls -lh; cat SHA256SUMS
          # A release with no packages is a silent failure — make it loud.
          test -s SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Windows cells without a mingw toolchain SKIP their package, so a
          # *.zip pattern may legitimately match nothing — anchor on the
          # package prefix and do not fail the release over a skipped target.
          files: |
            dist/ufot-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: false
