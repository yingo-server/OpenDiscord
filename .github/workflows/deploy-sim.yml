name: Deploy Simulation

# Real end-to-end execution of the deployment scripts on a CI runner.
# Not a --help smoke test: installs files, generates keys, checks permissions,
# verifies idempotency and reports on-disk footprint. All system paths are
# redirected to a sandbox under $RUNNER_TEMP via UFOT_* env overrides, so the
# runner itself is not modified (no real systemd start: --no-start).

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to install (e.g. v2.0.1); must be a published release'
        required: false
        default: 'v2.0.1'
  push:
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-sim.yml'

permissions:
  contents: read

jobs:
  install-sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare isolated prefixes from REAL release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ufot-deploy"
          SRC="$GITHUB_WORKSPACE"
          VER="${{ github.event.inputs.version || 'v2.0.1' }}"
          mkdir -p "$ROOT"/{prefix,etc,state,units,journald} "$ROOT/repo"
          # Download the ACTUAL published release tarball — no local build,
          # no mocks. This is the exact artifact users install.
          echo "=== downloading real release $VER (linux-amd64) ==="
          curl -sfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$VER" \
            -o "$ROOT/release.json"
          URL=$(python3 -c "import json,sys; d=json.load(open('$ROOT/release.json')); print([a['browser_download_url'] for a in d['assets'] if 'linux-amd64.tar.gz' in a['name']][0])")
          echo "url=$URL"
          curl -sfL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "$URL" -o "$ROOT/pkg.tar.gz"
          tar -xzf "$ROOT/pkg.tar.gz" -C "$ROOT/repo"
          echo "=== real package contents (top level) ==="
          ls -la "$ROOT/repo" | head -20
          # Release tarball has chatd at its root and deploy/ scripts; install.sh
          # looks for $REPO_DIR/dist/chatd. Normalize the extracted real
          # artifacts into that expected layout (no builds, just moving the
          # shipped files). Backend-only: there is no SPA in the package.
          mkdir -p "$ROOT/repo/dist"
          if [ -f "$ROOT/repo/chatd" ]; then
            mv "$ROOT/repo/chatd" "$ROOT/repo/dist/chatd"
          fi
          echo "=== chatd binary size (real, from release) ==="
          ls -la "$ROOT/repo/dist/chatd"
          cp -R "$ROOT/repo/deploy" "$ROOT/repo/deploy-run"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "UFOT_PREFIX=$ROOT/prefix" >> "$GITHUB_ENV"
          echo "UFOT_ETC=$ROOT/etc" >> "$GITHUB_ENV"
          echo "UFOT_STATE=$ROOT/state" >> "$GITHUB_ENV"
          echo "UFOT_UNIT_DIR=$ROOT/units" >> "$GITHUB_ENV"
          echo "UFOT_JOURNALD_DIR=$ROOT/journald" >> "$GITHUB_ENV"
          echo "=== isolated environment ==="
          env | grep '^UFOT_' | sort || true

      - name: Interactive wizard (REAL PTY, step-by-step prompts)
        run: |
          set -euo pipefail
          echo "=== driving install-interactive through a pseudo-terminal ==="
          sudo env UFOT_ETC="$UFOT_ETC" UFOT_PREFIX="$UFOT_PREFIX" UFOT_STATE="$UFOT_STATE" \
            python3 scripts/deploy-interactive-sim.py "$ROOT/repo/deploy/install-interactive" 2>&1 \
            | tee "$ROOT/interactive.log"

      - name: First install (full execution, --no-start)
        run: |
          set -euo pipefail
          echo "=== install.sh run #1 (trace on failure) ==="
          sudo env UFOT_ETC="$UFOT_ETC" UFOT_PREFIX="$UFOT_PREFIX" UFOT_STATE="$UFOT_STATE" \
            UFOT_UNIT_DIR="$UFOT_UNIT_DIR" UFOT_JOURNALD_DIR="$UFOT_JOURNALD_DIR" \
            bash "$ROOT/repo/deploy/install.sh" \
              --no-start --domain https://chat.example.com 2>&1 | tee "$ROOT/install-1.log"

      - name: Second install (idempotency check)
        run: |
          set -euo pipefail
          echo "=== install.sh run #2 (idempotency) ==="
          sudo env UFOT_ETC="$UFOT_ETC" UFOT_PREFIX="$UFOT_PREFIX" UFOT_STATE="$UFOT_STATE" \
            UFOT_UNIT_DIR="$UFOT_UNIT_DIR" UFOT_JOURNALD_DIR="$UFOT_JOURNALD_DIR" \
            bash "$ROOT/repo/deploy/install.sh" \
              --no-start --domain https://chat.example.com 2>&1 | tee "$ROOT/install-2.log"
          echo "=== idempotency assertions ==="
          grep -q '已存在，保持不变' "$ROOT/install-2.log" || {
            echo "FAIL: second run did not report preserved files"; exit 1; }
          echo "PASS: existing config/keys preserved on re-run"

      - name: Verify layout, permissions and footprint
        run: |
          set -euo pipefail
          echo "=== installed tree ==="
          sudo find "$UFOT_ETC" "$UFOT_STATE" "$UFOT_PREFIX" "$UFOT_UNIT_DIR" "$UFOT_JOURNALD_DIR" \
            -printf '%M %u:%g %s %p\n' | sort -k4 | tee "$ROOT/tree.txt"
          echo
          echo "=== key files ==="
          sudo find "$UFOT_ETC/keys" -type f -printf '%f %s bytes\n' | sort
          echo
          echo "=== footprint (du) ==="
          {
            echo "== deploy footprint =="
            sudo du -sh "$UFOT_ETC" "$UFOT_STATE" "$UFOT_PREFIX" "$UFOT_UNIT_DIR" "$UFOT_JOURNALD_DIR"
            echo "== total =="
            sudo du -sch "$UFOT_ETC" "$UFOT_STATE" "$UFOT_PREFIX" "$UFOT_UNIT_DIR" "$UFOT_JOURNALD_DIR" | tail -1
            echo "== file count =="
            sudo find "$UFOT_ETC" "$UFOT_STATE" "$UFOT_PREFIX" "$UFOT_UNIT_DIR" "$UFOT_JOURNALD_DIR" -type f | wc -l
          } | tee "$ROOT/footprint.txt"
          echo
          echo "=== permission red-line (other rwx must be empty) ==="
          BAD=$(sudo find "$UFOT_ETC" "$UFOT_STATE" ! -type l -perm /o+rwx -printf '%M %p\n')
          [ -z "$BAD" ] || { echo "FAIL: $BAD"; exit 1; }
          echo "PASS: no world-accessible paths under ETC/STATE"
          echo
          echo "=== journald unit installed correctly ==="
          test -f "$UFOT_JOURNALD_DIR/ufot.conf" || { echo "FAIL: journald conf missing"; exit 1; }
          test -f "$UFOT_UNIT_DIR/ufot.service" || { echo "FAIL: systemd unit missing"; exit 1; }
          echo "PASS: ufot.service + ufot.conf present"

      - name: Real chatd boot + migrate (creates real SQLite schema)
        run: |
          set -euo pipefail
          echo "=== booting REAL chatd from installed package to migrate DB ==="
          # The installed config's hot_db points into $UFOT_STATE; run the real
          # binary with APP_ENV=dev so dev_otp bootstrap is permitted, wait for
          # /healthz, then stop. The DB that remains is a genuine migrated DB.
          # Point the real chatd at the isolated state DB (installed toml uses
          # the packaged default path, which would write outside our sandbox).
          sudo sed -i "s|^hot_db *=.*|hot_db = \"$UFOT_STATE/chatd.db\"|" "$UFOT_ETC/ufot.toml"
          # --- new-config coverage: exercise the keys that gate the hosted-
          # frontend deployment shape (native TLS + cross-site cookie). TLS is
          # asserted by LISTENING with a self-signed pair and probing https;
          # cookie_same_site is asserted via the Set-Cookie attribute.
          echo "=== generate a throwaway cert pair for the TLS boot ==="
          CERTDIR=$(mktemp -d)
          sudo openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
            -keyout "$CERTDIR/tls.key" -out "$CERTDIR/tls.crt" \
            -subj "/CN=localhost" -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>/dev/null
          sudo tee -a "$UFOT_ETC/ufot.toml" > /dev/null <<TOMLEOF

# --- deploy-sim coverage (appended; not part of the packaged template) ---
tls_cert = "$CERTDIR/tls.crt"
tls_key = "$CERTDIR/tls.key"
cookie_same_site = "none"
TOMLEOF
          sudo env APP_ENV=dev UFOT_CONFIG="$UFOT_ETC/ufot.toml" \
            "$ROOT/repo/dist/chatd" --config "$UFOT_ETC/ufot.toml" \
            > "$ROOT/chatd-boot.log" 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 40); do
            if curl -sfk --max-time 1 https://127.0.0.1:8080/healthz >/dev/null 2>&1; then ok=1; break; fi
            sleep 0.5
          done
          echo "--- chatd boot log ---"; cat "$ROOT/chatd-boot.log"
          [ "$ok" -eq 1 ] || { echo "FAIL: real chatd did not become healthy over TLS"; exit 1; }
          echo "PASS: real chatd boot + healthz over native TLS (tls_cert/tls_key honored)"
          # Cookie attribute assertion: SameSite=None requires Secure at runtime.
          echo "=== assert Set-Cookie Secure + SameSite=None (cookie_same_site) ==="
          SC=$(curl -sk --max-time 5 -D - -o /dev/null -H 'Content-Type: application/json' \
            -d '{"nickname":"deploy-sim"}' https://127.0.0.1:8080/api/auth/guest | grep -i '^set-cookie:' || true)
          echo "$SC"
          echo "$SC" | grep -qi 'SameSite=None' || { echo "FAIL: cookie_same_site=none not reflected in Set-Cookie"; exit 1; }
          echo "$SC" | grep -qi 'Secure' || { echo "FAIL: Secure missing on SameSite=None cookie"; exit 1; }
          echo "PASS: cookie_same_site=none -> Secure; SameSite=None"
          sleep 1
          sudo kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "=== real migrated DB size ==="
          sudo find "$UFOT_STATE" -maxdepth 2 -type f -printf '%s %p\n' | sort
          echo "(if no DB yet, chatd uses lazy open; bootstrap a write below)"
          echo
          echo "=== FINAL footprint (with real binary, real migrated DB) ==="
          {
            echo "== deploy footprint (REAL) =="
            sudo du -sh "$UFOT_ETC" "$UFOT_STATE" "$UFOT_PREFIX" "$UFOT_UNIT_DIR" "$UFOT_JOURNALD_DIR"
            echo "== total =="
            sudo du -sch "$UFOT_ETC" "$UFOT_STATE" "$UFOT_PREFIX" "$UFOT_UNIT_DIR" "$UFOT_JOURNALD_DIR" | tail -1
            echo "== file count =="
            sudo find "$UFOT_ETC" "$UFOT_STATE" "$UFOT_PREFIX" "$UFOT_UNIT_DIR" "$UFOT_JOURNALD_DIR" -type f | wc -l
          } | tee "$ROOT/footprint-real.txt"

      - name: Backup script dry-run against REAL migrated DB
        run: |
          set -euo pipefail
          echo "=== backup.sh --dry-run (real migrated DB) ==="
          sudo env UFOT_ETC="$UFOT_ETC" UFOT_DB="$UFOT_STATE/chatd.db" \
            bash "$ROOT/repo/deploy/backup.sh" --dry-run 2>&1 | tee "$ROOT/backup-dry.log"

      - name: Load test against the REAL installed chatd
        # Informational: the main goal is verifying the real package installs
        # and boots. If the stress tool's schema assumptions diverge from the
        # shipped product schema, log it but don't fail deployment verification.
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== build stress tool in CI (test-only, not shipped) ==="
          go build -o "$ROOT/stressd" ./scripts/stress
          echo "=== restart real chatd with stress config (dev_otp + 18080) ==="
          # Stress tool injects accounts via dev_otp and talks to :18080; the
          # production toml has neither. Build a stress-only config that still
          # uses the REAL installed binary, real hot DB, real keys and policy.
          SC="$ROOT/stressconf"
          mkdir -p "$SC"
          {
            printf 'mode = "embedded"\n'
            printf 'listen = "127.0.0.1:18080"\n'
            printf 'admin_listen = "127.0.0.1:17780"\n'
            printf 'admin_rest_listen = "127.0.0.1:17781"\n'
            printf 'public_origin = "http://localhost:18080"\n'
            printf 'hot_db = "%s/chatd.db"\n' "$UFOT_STATE"
            printf 'admin_db = "%s/admin.db"\n' "$UFOT_STATE"
            printf 'policy_path = "%s/policy.json"\n' "$UFOT_ETC"
            printf 'jwt_key_path = "%s/keys/jwt_sign_key.pem"\n' "$UFOT_ETC"
            printf 'media_dir = "%s/media"\n' "$UFOT_STATE"
            printf 'log_level = "info"\n'
            printf 'dev_otp = true\n'
          } > "$SC/chatd.toml"
          sudo env APP_ENV=dev UFOT_CONFIG="$SC/chatd.toml" \
            "$ROOT/repo/dist/chatd" --config "$SC/chatd.toml" \
            > "$ROOT/chatd-load.log" 2>&1 &
          CPID=$!
          ok=0
          for i in $(seq 1 40); do
            curl -sf --max-time 1 http://127.0.0.1:18080/healthz >/dev/null 2>&1 && { ok=1; break; }
            sleep 0.5
          done
          [ "$ok" -eq 1 ] || { echo "FAIL: chatd not healthy for load"; cat "$ROOT/chatd-load.log"; exit 1; }
          # S-2 smoke: 64 conns x 10s, mixed ops, no boot (chatd already up).
          echo "=== real hot DB schema (tables) ==="
          sudo sqlite3 "$UFOT_STATE/chatd.db" ".tables" 2>/dev/null || \
            sudo python3 -c "import sqlite3,sys; print([r[0] for r in sqlite3.connect(sys.argv[1]).execute(\"select name from sqlite_master where type='table'\")])" "$UFOT_STATE/chatd.db"
          echo "=== stressd run (S-2 smoke, real chatd) ==="
          CHATD_DB="$UFOT_STATE/chatd.db" sudo -E "$ROOT/stressd" \
            -no-boot -base http://127.0.0.1:18080 \
            -mode mixed -conns 64 -duration 10 -conv-members 10 \
            -interval 100ms -no-ratelimit \
            -out "$ROOT/stress-result.json" 2>&1 | tee "$ROOT/stress.log"
          python3 -c "import json; d=json.load(open('$ROOT/stress-result.json')); [print('LOAD RESULT: conns=%s avail=%.2f%% acks=%s attempted=%s rpm=%s p95=%.1fms drop=%s' % (lv.get('conns',0),lv.get('availability_pct',0),lv.get('msg_send_acks',0),lv.get('msg_send_attempted',0),lv.get('rpm',0),lv.get('p95_ms',0),lv.get('server_drop',0))) for lv in d.get('levels',[])]"
          sudo kill "$CPID" 2>/dev/null || true
          wait "$CPID" 2>/dev/null || true

      - name: Upload simulation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-simulation-logs
          path: |
            ${{ runner.temp }}/ufot-deploy/*.log
            ${{ runner.temp }}/ufot-deploy/tree.txt
            ${{ runner.temp }}/ufot-deploy/footprint.txt
            ${{ runner.temp }}/ufot-deploy/footprint-real.txt
            ${{ runner.temp }}/ufot-deploy/chatd-boot.log
            ${{ runner.temp }}/ufot-deploy/chatd-load.log
            ${{ runner.temp }}/ufot-deploy/stress.log
            ${{ runner.temp }}/ufot-deploy/stress-result.json
          if-no-files-found: warn
