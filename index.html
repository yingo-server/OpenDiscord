<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UFOT</title>
<style>
  @font-face {
    font-family: 'Song Subset';
    src: url('notoserif-subset.woff2') format('woff2');
    font-display: swap;
  }

  :root {
    --glow: 0 0 30px rgba(255,255,255,.35), 0 0 60px rgba(255,255,255,.15);
    --ease: cubic-bezier(.25,.1,.25,1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* 背景层：黑夜图（已预压暗55%），不再用 CSS filter 叠加压暗 */
  .bg {
    position: fixed; inset: 0;
    background: url('night-bg.jpg') center/cover no-repeat;
  }
  .vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,.5) 100%);
  }

  /* 内容层：垂直居中 */
  main {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(1.5rem, 4vw, 3rem);
    padding: 0 1.5rem;
    text-align: center;
    color: #fff;
  }

  /* 英文：新纽曼风格衬线，加辉光 */
  .en {
    font-family: 'New York', 'Times New Roman', 'Palatino', Georgia, serif;
    font-size: clamp(2rem, 5vw, 4rem);
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: 0.01em;
    text-shadow: var(--glow);
    opacity: 0;
    animation: fadein 2s var(--ease) .3s forwards;
  }

  /* 中文：简宋矢量，偏小 */
  .zh {
    font-family: 'Song Subset', 'Noto Serif SC', 'Songti SC', serif;
    font-size: clamp(1rem, 2.2vw, 1.75rem);
    font-weight: 400;
    letter-spacing: .12em;
    color: rgba(255,255,255,.88);
    text-shadow: 0 0 20px rgba(255,255,255,.2);
    opacity: 0;
    animation: fadein 2s var(--ease) .6s forwards;
  }


  @keyframes fadein {
    to { opacity: 1; }
  }

  /* 整页链接：覆盖全屏、无链接视觉噪音，继承点击行为 */
  .page {
    position: fixed; inset: 0;
    display: block;
    color: inherit; text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .page > .bg, .page > .vignette { position: absolute; }

  /* 三档断点预设换行 */
  @media (max-width: 600px) {
    .en { font-size: 1.5rem; max-width: 90vw; }
    .zh { font-size: .95rem; }
  }
  @media (min-width: 601px) and (max-width: 1024px) {
    .en { font-size: 2.5rem; max-width: 70vw; }
    .zh { font-size: 1.25rem; }
  }
  @media (min-width: 1025px) {
    .en { font-size: 3.5rem; max-width: 60vw; }
    .zh { font-size: 1.5rem; }
  }

  /* 横屏（矮视口）：压缩纵向间距，给底部提示留出行 */
  @media (orientation: landscape) and (max-height: 500px) {
    main { gap: 1rem; }
    .en { font-size: clamp(1.5rem, 4.2vw, 2.5rem); }
    .zh { font-size: clamp(.9rem, 1.8vw, 1.15rem); }
  }

</style>
</head>
<body>
  <!-- 整页可点击的仓库链接：无 JS 也能跳转（预览 WebView 拦 JS 导航时仍有效） -->
  <a class="page" href="https://github.com/yingo-server/UFOT" aria-label="进入 UFOT 仓库">
  <div class="bg"></div>
  <div class="vignette"></div>

  <main id="main">
    <div class="en">They demanded unfettered freedom of thought.</div>
    <div class="zh">他们要求不受束缚的思想自由</div>
  </main>
  </a>


</body>
</html>
