<!doctype html>
<html><head><meta charset="utf-8"><title>UFOT 930 诊断</title></head>
<body style="font:14px monospace;background:#111;color:#eee;padding:20px">
<pre id="o">准备中…</pre>
<script>
const o=document.getElementById('o');
const log=s=>o.textContent += '\n'+s;
(async()=>{
  o.textContent='';
  log('origin='+location.origin);
  // 使用当前页面已有的 UFOT 会话（localStorage），如果没有则游客登录
  let s=JSON.parse(localStorage.getItem('ufot.session')||'null');
  if(!s){
    const r=await fetch('https://server.344977.xyz:3004/api/auth/guest',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:'{"nickname":"diag930"}'});
    s=await r.json(); log('guest uid='+s.user_id);
  } else log('session uid='+s.user_id);
  log('ws url=wss://server.344977.xyz:3004/ws');
  const ws=new WebSocket('wss://server.344977.xyz:3004/ws');
  ws.onopen=()=>{
    log('OPEN');
    const p=btoa(JSON.stringify({op:7,body:''}));
    const frame={id:99,kind:930,request_id:'diag-930',payload:p};
    log('SEND '+JSON.stringify(frame));
    ws.send(JSON.stringify(frame));
  };
  ws.onmessage=e=>{
    let t=e.data;
    try{ const f=JSON.parse(t); if(f.payload){f.payload=JSON.parse(atob(f.payload));} t=JSON.stringify(f); }catch(err){}
    log('RECV '+t.slice(0,500));
  };
  ws.onerror=()=>log('WS-ERROR');
  ws.onclose=e=>log('CLOSE '+e.code+' '+e.reason);
  setTimeout(()=>{log('DONE (10s)'); ws.close();},10000);
})();
</script>
</body></html>
