<!doctype html>
<html><head><meta charset="utf-8"><title>probe</title></head>
<body style="font:14px monospace;background:#111;color:#eee;padding:16px"><pre id="o">run</pre><script>
const o=document.getElementById('o');
const log=s=>o.textContent+="\n"+s;
(async()=>{
  log("page origin = " + location.origin);
  try{
    const r=await fetch('https://server.344977.xyz:3004/api/auth/methods',{credentials:'include'});
    const t=await r.text();
    log('backend /methods -> '+r.status+' '+t.slice(0,80));
    const r2=await fetch('https://server.344977.xyz:3004/api/auth/guest',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:'{"nickname":"netlify-probe"}'});
    const j=await r2.json();
    log('backend /guest -> '+r2.status+' user='+(j.user_id||'?')+' err='+(j.error||j.code||'none'));
  }catch(e){log('backend FAIL: '+e.message)}
  log('DONE');
})();
</script></body></html>
